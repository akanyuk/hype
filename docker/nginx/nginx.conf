error_log /dev/stdout;
events {
    worker_connections 1024;
}
http {
    include mime.types;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 55m;

    fastcgi_connect_timeout 1;
    fastcgi_read_timeout 300;
    proxy_read_timeout 950s;
	
    server {
        listen 80;
        server_name_in_redirect off;

        root /opt/www/;

        # Hidden files: .git, .htaccess, .gitignore (except ACME challenges)
        location ^~ /.well-known/ { }
        location ~ /\. { return 404; }

        # Engine code, configs, runtime data and plugin internals.
        # Public: templates/skin, templates/cache, templates/common, engine/lib/external,
        # plugins/*/templates/skin, plugins/*/images, uploads
        location ~ ^/(config|classes|include|logs|tmp)(/|$) { return 404; }
        location ~ ^/templates/(compiled|language|skin/[^/]+/settings)(/|$) { return 404; }
        location ~ ^/engine/(?!lib/external/) { return 404; }
        location ~ ^/plugins/[^/]+/(?!templates/skin/|images/) { return 404; }

        # Templates and service files anywhere (manifest.json and browserconfig.xml stay public)
        location ~* \.(tpl|sql|log|md|txt|ini|dat|sh|cmd|lock|dist|bak|orig|swp)$ { return 404; }
        location ~* ^(?!/(manifest\.json|browserconfig\.xml)$).*\.(xml|json|yml|yaml)$ { return 404; }

        location ~* \.(jpg|jpeg|png|gif)$ {
            try_files $uri @imgproxy;
        }
        location @imgproxy {
            rewrite ^/(.*) https://hype.retroscene.org/$1;
        }

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # PHP runs only for the entry points; any other .php is 404
        location ~ \.php$ {
            if ($uri !~ "^/(index|rnd-logo|engine/lib/external/kcaptcha/index)\.php$") {
                return 404;
            }
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
        }
    }
}
